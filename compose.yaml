name: ${COMPOSE_PROJECT_NAME:-frappe-stack}

x-app: &app
  image: ${CUSTOM_IMAGE:-local/frappe-suite}:${CUSTOM_TAG:-16}
  pull_policy: never
  restart: unless-stopped
  environment:
    TZ: ${TZ:-Europe/Berlin}
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

x-ready: &ready
  configurator:
    condition: service_completed_successfully

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis-cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30

  redis-queue:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30

  configurator:
    <<: *app
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    entrypoint: [bash, -ec]
    command:
      - |
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host db
        bench set-config -gp db_port 3306
        bench set-config -g redis_cache redis://redis-cache:6379
        bench set-config -g redis_queue redis://redis-queue:6379
        bench set-config -g redis_socketio redis://redis-queue:6379
        bench set-config -gp socketio_port 9000
        bench set-config -g chromium_path /usr/lib/chromium/chromium-headless-shell

  backend:
    <<: *app
    depends_on: *ready

  websocket:
    <<: *app
    depends_on: *ready
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]

  queue-short:
    <<: *app
    depends_on: *ready
    command: [bench, worker, --queue, 'short,default']

  queue-long:
    <<: *app
    depends_on: *ready
    command: [bench, worker, --queue, 'long,default,short']

  scheduler:
    <<: *app
    depends_on: *ready
    command: [bench, schedule]

  frontend:
    <<: *app
    command: [nginx-entrypoint.sh]
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${ERP_SITE:-erp.localhost}
      NGINX_LISTEN_PORT: '8080'
      CLIENT_MAX_BODY_SIZE: 100m
      PROXY_READ_TIMEOUT: '120'
    ports:
      - '${HTTP_BIND:-127.0.0.1}:${ERP_PORT:-8080}:8080'

  suite-frontend:
    <<: *app
    command: [nginx-entrypoint.sh]
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SUITE_SITE:-suite.localhost}
      NGINX_LISTEN_PORT: '8080'
      CLIENT_MAX_BODY_SIZE: 100m
      PROXY_READ_TIMEOUT: '120'
    ports:
      - '${HTTP_BIND:-127.0.0.1}:${SUITE_PORT:-8081}:8080'

  setup:
    <<: *app
    profiles: [setup]
    restart: 'no'
    depends_on: *ready
    environment:
      ERP_SITE: ${ERP_SITE:-erp.localhost}
      SUITE_SITE: ${SUITE_SITE:-suite.localhost}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./scripts/setup-sites.sh:/opt/setup-sites.sh:ro
    command: [bash, /opt/setup-sites.sh]

volumes:
  sites:
  logs:
  db-data:
  redis-data:
